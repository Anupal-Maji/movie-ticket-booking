<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMySee</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #141414; 
    color: white;
    padding: 20px;
}

h1 {
text-align: center;
color: #e50914; 
font-size: 32px;
margin-bottom: 20px;
}

.container {
    display: flex;
    gap: 20px;
}

.sidebar {
    width: 220px;
    min-width: 220px;
    background-color: #1f1f1f;
    padding: 20px;
    border-radius: 10px;
    height: fit-content;
}

.sidebar h3 {
    color: #e50914;
    margin-bottom: 10px;
    font-size: 16px;
    text-transform: uppercase;
}

.filter-group {
    margin-bottom: 25px;
}

.filter-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    cursor: pointer;
}

.filter-item input {
    cursor: pointer;
    width: 16px;
    height: 16px;
}

.filter-item label {
    cursor: pointer;
    font-size: 14px;
    color: #cccccc;
}

.count {
    color: #888888;
    font-size: 12px;
}

select {
    width: 100%;
    padding: 8px;
    background-color: #333;
    color: white;
    border: 1px solid #555;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.main {
    flex: 1;
}

.results-info {
    color: #888;
    font-size: 14px;
    margin-bottom: 15px;
}
 
.loading {
    text-align: center;
    font-size: 18px;
    color: #888;
    padding: 50px;
}

.movies-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

.movie-card {
    background-color: #1f1f1f;
    border-radius: 8px;
    padding: 15px;
    transition: transform 0.2s;
}

.movie-card:hover {
    transform: scale(1.03);   
}

.movie-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 8px;
    color: white;
    text-transform: capitalize;
}

.movie-genre {
    font-size: 12px;
    color: #e50914;
    margin-bottom: 4px;
}

.movie-language {
    font-size: 12px;
    color: #aaaaaa;
    margin-bottom: 4px;
}

.movie-rating {
    font-size: 12px;
    color: #f5c518;    
}    

.movie-date {
      font-size: 11px;
      color: #666666;
      margin-top: 4px;
    }

.no-movies {
      text-align: center;
      color: #888;
      font-size: 18px;
      padding: 50px;
    }

.pagination { 
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
    padding: 20px 0;
}

.pagination button {
    background-color: #e50914;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 14px;
}

.pagination button:disabled {
    background-color: #555;
    cursor: not-allowed;
}

.pagination button:hover:not(:disabled) {
    background-color: #ff0000;
}

.page-info {
    color: #aaaaaa;
    font-size: 14px;
}

</style>
</head>

<body>

<h1>Movie Filter App</h1>
<div class="container">
<div class="sidebar">
<div class="filter-group">
<h3>Genre</h3>
<div id="genre-filters">
<div class="loading">Loading...</div>
</div>
</div>

<div class="filter-group">
<h3>Language</h3>

<div id="language-filters">
<div class="loading">Loading...</div>
</div>
</div>

<div class="filter-group">
<h3>Sort By</h3>
<select id="sort-select">
<option value="rating">Rating (High to Low)</option>
<option value="release_date">Release Date (Newest)</option>
<option value="title">Title (A to Z)</option>
</select>
</div>

</div>

<div class="main">

<div class="results-info" id="results-info">Loading movies...</div>

<div class="movies-grid" id="movies-grid">
<div class="loading">Loading movies...</div>
</div>

<div class="pagination">
<button id="prev-btn" disabled>Previous</button>
<span class="page-info" id="page-info">Page 1</span>
<button id="next-btn" disabled>Next</button>
</div>

</div>

</div>

<script>

const API = '';  

let currentPage      = 1;   
let selectedGenres   = [];  
let selectedLanguages = []; 
let currentSort      = 'rating'; 

async function loadFilterCounts() {

const params = new URLSearchParams();
if (selectedGenres.length > 0) {
    params.set('genres', selectedGenres.join(','));
}
      
if (selectedLanguages.length > 0) {
    params.set('languages', selectedLanguages.join(','));
}

try {
    const response = await fetch(`${API}/api/filter-counts?${params.toString()}`);
    const data = await response.json();

showGenreCheckboxes(data.genres);

showLanguageCheckboxes(data.languages);

} catch (error) {
    console.log('Error loading filters:', error);
    document.getElementById('genre-filters').innerHTML =
'<p style="color:red">Error loading filters</p>';
document.getElementById('language-filters').innerHTML =
'<p style="color:red">Error loading filters</p>';
   }
}

function showGenreCheckboxes(genres) {

const container = document.getElementById('genre-filters');

container.innerHTML = genres.map(item => `
<div class="filter-item">
<input
type="checkbox"
id="genre-${item.genre}"
value="${item.genre}"
${selectedGenres.includes(item.genre) ? 'checked' : ''}
onchange="onGenreChange(this)">
<label for="genre-${item.genre}">
${item.genre}
<span class="count">(${item.count})</span>
</label>
</div>
`).join('');
}

function showLanguageCheckboxes(languages) {

const container = document.getElementById('language-filters');

container.innerHTML = languages.map(item => `
<div class="filter-item">
<input type="checkbox" id="lang-${item.language} "value="${item.language}" ${selectedLanguages.includes(item.language) ? 'checked' : ''}
onchange="onLanguageChange(this)">
<label for="lang-${item.language}">
${item.language}
<span class="count">(${item.count})</span>
</label>
</div>
`).join('');
}

async function loadMovies() {

document.getElementById('movies-grid').innerHTML ='<div class="loading">Loading movies...</div>';

const params = new URLSearchParams();

if (selectedGenres.length > 0) {
    params.set('genres', selectedGenres.join(','));
}

if (selectedLanguages.length > 0) {
    params.set('languages', selectedLanguages.join(','));
}

params.set('sortBy', currentSort);
params.set('page',   currentPage);

try {       
const response = await fetch(
    `${API}/api/movies?${params.toString()}`);
const data = await response.json();

showMovies(data.movies);

document.getElementById('results-info').textContent =
`Showing ${data.movies.length} of ${data.totalMovies} movies`;
        
updatePagination(data.currentPage, data.totalPages);

} catch (error) {
    console.log('Error loading movies:', error);
    document.getElementById('movies-grid').innerHTML =
    '<div class="no-movies">Error loading movies. Is your server running?</div>';
    }
}

function showMovies(movies) {

const grid = document.getElementById('movies-grid');
  
if (movies.length === 0) {
    grid.innerHTML =
    '<div class="no-movies">No movies found for selected filters.</div>';
    return;
}

grid.innerHTML = movies.map(movie => `
<div class="movie-card">
<div class="movie-title">${movie.title}</div>
<div class="movie-genre"> ${movie.genre}</div>
<div class="movie-language"> ${movie.language}</div>
<div class="movie-rating"> ${movie.rating}/10</div>
<div class="movie-date"> ${movie.release_date}</div>
</div>
`).join('');
}

function updatePagination(current, total) {

document.getElementById('page-info').textContent =
`Page ${current} of ${total}`;

document.getElementById('prev-btn').disabled = (current <= 1);

document.getElementById('next-btn').disabled = (current >= total);
}

function onGenreChange(checkbox) {

    if (checkbox.checked) {
        selectedGenres.push(checkbox.value);
} else {
    selectedGenres = selectedGenres.filter(g => g !== checkbox.value);
}

currentPage = 1;

loadMovies();
loadFilterCounts();
}

function onLanguageChange(checkbox) {
    if (checkbox.checked) {
        selectedLanguages.push(checkbox.value);
      } else {
        selectedLanguages =
        selectedLanguages.filter(l => l !== checkbox.value);
}

currentPage = 1;

loadMovies();
loadFilterCounts();
}

document.getElementById('sort-select')
.addEventListener('change', function() {
currentSort = this.value;
currentPage = 1;
loadMovies();
});

document.getElementById('prev-btn')
.addEventListener('click', function() {
if (currentPage > 1) {
currentPage--;
loadMovies();
}
});

document.getElementById('next-btn')
.addEventListener('click', function() {
currentPage++;
loadMovies();
});

loadFilterCounts();
loadMovies();

</script>

</body>
</html>
