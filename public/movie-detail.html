<!DOCTYPE html>
<html lang="en">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Detail</title>
  <style>
 
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
 
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color:#ffffff;
      padding: 20px;
    }
 
    .navbar {
      background-color: #1f1f1f;
      padding: 15px 20px;
      margin-bottom: 30px;
      border-radius: 8px;
    }
 
    .navbar h1 {
      color: #e50914;
      font-size: 24px;
    }
 
    .movie-card {
      max-width: 800px;
      margin: 0 auto;
      background-color: #1f1f1f;
      border-radius: 12px;
      padding: 30px;
    }
 
    .movie-title {
      font-size: 32px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 10px;
    }
 
    .movie-info {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
      color: #aaaaaa;
      font-size: 15px;
    }
 
    .movie-info span {
      background-color: #2d2d2d;
      padding: 5px 12px;
      border-radius: 20px;
    }
 
    .trailer-section {
      margin-bottom: 30px;
    }
 
    .trailer-section h2 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #e50914;
    }
 
    .trailer-container {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      background-color: #000000;
      border-radius: 10px;
      overflow: hidden;
    }
 
    .trailer-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
 
    .no-trailer {
      background-color: #2d2d2d;
      border: 2px dashed #555555;
      border-radius: 10px;
      padding: 60px 40px;
      text-align: center;
      color: #aaaaaa;
      font-size: 16px;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
 
    .no-trailer .fallback-icon {
      font-size: 50px;
    }
 
    .no-trailer .fallback-title {
      font-size: 18px;
      color: #ffffff;
      font-weight: bold;
    }
 
    .no-trailer .fallback-subtitle {
      font-size: 14px;
      color: #777777;
    }
 
    .trailer-loading {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaaaaa;
      font-size: 16px;
      border-radius: 10px;
    }
 
    .book-btn {
      display: block;
      width: 100%;
      padding: 15px;
      background-color: #e50914;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
    }
 
    .book-btn:hover {
      background-color: #b20710;
    }
 
    .loading {
      text-align: center;
      padding: 50px;
      color: #aaaaaa;
      font-size: 18px;
    }
 
    .error {
      text-align: center;
      padding: 50px;
      color: #e50914;
      font-size: 18px;
    }
 
    /* ---- Seat map styles ---- */
 
    .seat-section {
      margin-top: 20px;
    }
 
    .seat-section h2 {
      font-size: 20px;
      margin-bottom: 15px;
      color: #e50914;
    }
 
    .screen-bar {
      background-color: #2d2d2d;
      color: #aaaaaa;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 25px;
      font-size: 13px;
      letter-spacing: 2px;
    }
 
    .seat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
 
    .row-label {
      width: 20px;
      color: #aaaaaa;
      font-size: 14px;
    }
 
    .seat-grid {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
 
    .seat {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background-color: #2d2d2d;
      border: 1px solid #444444;
      color: #ffffff;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
 
    .seat:hover {
      border-color: #e50914;
    }
 
    .seat.selected {
      background-color: #e50914;
      border-color: #e50914;
    }
 
    .seat.taken {
      background-color: #444444;
      color: #777777;
      cursor: not-allowed;
      border-color: #444444;
    }
 
    .seat-legend {
      display: flex;
      gap: 20px;
      margin: 20px 0;
      font-size: 13px;
      color: #aaaaaa;
    }
 
    .seat-legend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }
 
    .legend-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      display: inline-block;
    }
 
    .legend-available { background-color: #2d2d2d; border: 1px solid #444444; }
    .legend-selected { background-color: #e50914; }
    .legend-taken { background-color: #444444; }
 
    .timer-bar {
      background-color: #2d2d2d;
      border: 1px solid #e50914;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 20px 0;
      text-align: center;
      font-size: 16px;
      display: none;
    }
 
    .timer-bar.active {
      display: block;
    }
 
    .timer-bar span {
      color: #e50914;
      font-weight: bold;
    }
 
    .seat-message {
      text-align: center;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
      display: none;
    }
 
    .seat-message.error {
      background-color: #3a1414;
      color: #ff6b6b;
      display: block;
    }
 
  </style>
</head>
 
<body>
 
  <div class="navbar">
    <h1>My Movie App</h1>
  </div>
 
  <div id="main-content">
    <div class="loading">Loading movie details...</div>
  </div>
 
  <script>
 
    const urlParams = new URLSearchParams(window.location.search);
    const movieId = urlParams.get('id');
 
    // Fixed show ID for now - every movie uses the same show/seat map
    const showId = movieId;
 
    // A simple made-up user ID so different browser tabs can simulate different users.
    // In a real app this would come from a logged-in user's account.
    const userId = (() => {
      let id = sessionStorage.getItem('demoUserId');
      if (!id) {
        id = Math.floor(Math.random() * 100000);
        sessionStorage.setItem('demoUserId', id);
      }
      return id;
    })();
 
    const ROWS = ['A', 'B', 'C', 'D', 'E'];
    const SEATS_PER_ROW = 8;
 
    let selectedSeat = null;
    let countdownInterval = null;
    let trailerLoaded = false;
 
    // Turns special characters into safe text, so a movie title or genre
    // can never be run as HTML or JavaScript (XSS protection).
    function escapeHtml(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
 
    if (!movieId) {
      document.getElementById('main-content').innerHTML = `
        <div class="error">No movie selected.<br><br>
        <a href="index.html" style="color: #e50914;">Go back to movies</a>
        </div>
        `;
    } else {
 
      fetch(`/api/movies/${encodeURIComponent(movieId)}`)
        .then(response => {
          if (!response.ok) throw new Error('Movie not found');
          return response.json();
        })
        .then(result => {
 
          const movie = result.data;
 
          let trailerHTML = '';
 
          if (movie.trailer_url) {
 
            // The iframe starts with NO address (data-src, not src).
            // setupLazyLoading() gives it the real address only when the
            // trailer scrolls into view, so slow networks load the page first.
            trailerHTML = `
              <div class="trailer-section">
                <h2>Watch Trailer</h2>
                <div class="trailer-container" id="trailer-container">
                  <div class="trailer-loading" id="trailer-loading">
                    Trailer loads when you scroll here...
                  </div>
                  <iframe
                    id="trailer-iframe"
                    data-src="${escapeHtml(movie.trailer_url)}?rel=0&amp;modestbranding=1"
                    allowfullscreen
                    title="${escapeHtml(movie.title)} Trailer"
                    style="opacity: 0;">
                  </iframe>
                </div>
              </div>
            `;
          } else {
 
            trailerHTML = `
              <div class="trailer-section">
                <h2>Watch Trailer</h2>
                <div class="no-trailer">
                  <div class="fallback-icon">🎬</div>
                  <div class="fallback-title">Trailer Not Available</div>
                  <div class="fallback-subtitle">
                    The trailer for this movie is currently unavailable.
                    <br>
                    Check back later or search on YouTube.
                  </div>
                </div>
              </div>
            `;
          }
 
          const seatMapHTML = buildSeatMapHTML();
 
          const pageHTML = `
            <div class="movie-card">
              <div class="movie-title">${escapeHtml(movie.title)}</div>
              <div class="movie-info">
                <span>${escapeHtml(movie.genre)}</span>
                <span>${escapeHtml(movie.language)}</span>
              </div>
              ${trailerHTML}
              <div class="seat-section">
                <h2>Select Your Seat</h2>
                <div class="screen-bar">SCREEN THIS WAY</div>
                <div id="seat-message" class="seat-message"></div>
                ${seatMapHTML}
                <div class="seat-legend">
                  <span><span class="legend-box legend-available"></span> Available</span>
                  <span><span class="legend-box legend-selected"></span> Selected</span>
                  <span><span class="legend-box legend-taken"></span> Taken</span>
                </div>
                <div id="timer-bar" class="timer-bar">
                  Seat held for <span id="timer-display">2:00</span> — complete payment before it expires
                </div>
                <button class="book-btn" id="book-btn">
                  Proceed to Payment
                </button>
              </div>
            </div>
          `;
 
          document.getElementById('main-content').innerHTML = pageHTML;
 
          // The button no longer builds JavaScript text from the movie title.
          document.getElementById('book-btn').addEventListener('click', () => {
            proceedToPayment(movie.id, movie.title);
          });
 
          setupLazyLoading();
 
        })
        .catch(error => {
          document.getElementById('main-content').innerHTML = `
            <div class="error">Could not load movie details. Please try again.<br><br>
            <a href="index.html" style="color: #e50914;">Go back to movies</a>
            </div>
          `;
        });
 
    }
 
    function buildSeatMapHTML() {
      let rowsHTML = '';
      ROWS.forEach(row => {
        let seatsHTML = '';
        for (let i = 1; i <= SEATS_PER_ROW; i++) {
          const seatNumber = `${row}${i}`;
          seatsHTML += `<div class="seat" id="seat-${seatNumber}" onclick="selectSeat('${seatNumber}')">${seatNumber}</div>`;
        }
        rowsHTML += `
          <div class="seat-row">
            <div class="row-label">${row}</div>
            <div class="seat-grid">${seatsHTML}</div>
          </div>
        `;
      });
      return rowsHTML;
    }
 
    function showSeatMessage(text) {
      const messageDiv = document.getElementById('seat-message');
      if (!messageDiv) return;
      messageDiv.textContent = text;
      messageDiv.className = 'seat-message error';
      setTimeout(() => {
        messageDiv.className = 'seat-message';
        messageDiv.textContent = '';
      }, 3000);
    }
 
    function selectSeat(seatNumber) {
      const seatEl = document.getElementById(`seat-${seatNumber}`);
      if (!seatEl || seatEl.classList.contains('taken')) return;
 
      fetch('/api/seats/lock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ showId, seatNumber, userId })
      })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            if (selectedSeat && selectedSeat !== seatNumber) {
              const prevEl = document.getElementById(`seat-${selectedSeat}`);
              if (prevEl) prevEl.classList.remove('selected');
            }
            selectedSeat = seatNumber;
            seatEl.classList.add('selected');
            startCountdown(120);
          } else {
            seatEl.classList.add('taken');
            showSeatMessage('Seat unavailable');
            refreshSeatMap();
          }
        })
        .catch(() => {
          showSeatMessage('Could not reach the server. Please try again.');
        });
    }
 
    function refreshSeatMap() {
      // In this simple version there is no "get all seat statuses" endpoint yet,
      // so we just clear the visual selection state seat-by-seat as locks fail.
      // A future improvement would be an endpoint that returns every taken seat
      // for this showId, so the whole map can be redrawn accurately on load.
    }
 
    function startCountdown(seconds) {
      clearInterval(countdownInterval);
      let remaining = seconds;
      const timerBar = document.getElementById('timer-bar');
      const timerDisplay = document.getElementById('timer-display');
      timerBar.classList.add('active');
 
      updateTimerDisplay(remaining, timerDisplay);
 
      countdownInterval = setInterval(() => {
        remaining--;
        updateTimerDisplay(remaining, timerDisplay);
 
        if (remaining <= 0) {
          clearInterval(countdownInterval);
          timerBar.classList.remove('active');
          if (selectedSeat) {
            const seatEl = document.getElementById(`seat-${selectedSeat}`);
            if (seatEl) seatEl.classList.remove('selected');
            showSeatMessage('Your seat hold expired. Please select again.');
            selectedSeat = null;
          }
        }
      }, 1000);
    }
 
    function updateTimerDisplay(remainingSeconds, timerDisplay) {
      const minutes = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      timerDisplay.textContent = `${minutes}:${secs.toString().padStart(2, '0')}`;
    }
 
    const PRICE_PER_SEAT = 200;
 
    function proceedToPayment(movieId, movieTitle) {
      if (!selectedSeat) {
        showSeatMessage('Please select a seat first');
        return;
      }
 
      const userName = prompt('Enter your name:');
      if (!userName) {
        showSeatMessage('Name is required to proceed');
        return;
      }
 
      const userEmail = prompt('Enter your email:');
      if (!userEmail) {
        showSeatMessage('Email is required to proceed');
        return;
      }
 
      const today = new Date().toISOString().split('T')[0];
 
      const bookingPayload = {
        user_name: userName,
        user_email: userEmail,
        movie_name: movieTitle,
        movie_id: movieId,
        theatre_name: 'PVR Bengaluru',
        show_date: today,
        show_time: '7:00 PM',
        seat_numbers: selectedSeat,
        payment_id: 'pending',
        total_amount: PRICE_PER_SEAT
      };
 
      fetch('/api/bookings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bookingPayload)
      })
        .then(response => response.json())
        .then(data => {
          if (data.success) {
            window.location.href = `payment.html?booking_id=${data.bookingId}`;
          } else {
            showSeatMessage('Could not create booking: ' + data.message);
          }
        })
        .catch(() => {
          showSeatMessage('Could not reach the server. Please try again.');
        });
    }
 
    // Runs when the trailer has really loaded: hides the "loading" cover
    // and fades the video in.
    function handleTrailerLoad() {
      trailerLoaded = true;
      const loadingDiv = document.getElementById('trailer-loading');
      if (loadingDiv) loadingDiv.style.display = 'none';
      const iframe = document.getElementById('trailer-iframe');
      if (iframe) {
        iframe.style.opacity = '1';
        iframe.style.transition = 'opacity 0.5s ease';
      }
    }
 
    // Shows the friendly fallback box instead of a broken video.
    function handleTrailerError() {
      const container = document.getElementById('trailer-container');
      if (container) {
        container.outerHTML = `
          <div class="no-trailer">
            <div class="fallback-icon">🎬</div>
            <div class="fallback-title">Trailer Unavailable</div>
            <div class="fallback-subtitle">
              This trailer could not be loaded.
              <br>
              Search for it on YouTube instead.
            </div>
          </div>
        `;
      }
    }
 
    // Lazy loading: the trailer only starts downloading when it is at least
    // 25% visible on screen. If it has not loaded within 10 seconds after
    // that, the fallback box is shown.
    function setupLazyLoading() {
      const iframe = document.querySelector('iframe[data-src]');
      if (!iframe) return;
 
      function loadTrailer() {
        iframe.addEventListener('load', handleTrailerLoad, { once: true });
        iframe.src = iframe.getAttribute('data-src');
        iframe.removeAttribute('data-src');
 
        setTimeout(() => {
          if (!trailerLoaded) handleTrailerError();
        }, 10000);
      }
 
      // Very old browsers without IntersectionObserver: just load it.
      if (!('IntersectionObserver' in window)) {
        loadTrailer();
        return;
      }
 
      const observer = new IntersectionObserver(
        function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              loadTrailer();
              observer.unobserve(iframe);
            }
          });
        },
        { threshold: 0.25 }
      );
 
      observer.observe(iframe);
    }
 
  </script>
 
</body>
</html>
